CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# Avoid Kconfig warnings from board defaults pulling in I2C shell options.
CONFIG_I2C_SHELL=n
CONFIG_FPU=y
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_VIDEO=y
CONFIG_VIDEO_SYNA_ENC=y
CONFIG_VIDEO_SYNA_MIPI=n
CONFIG_VIDEO_INIT_PRIORITY=90

# Two 128 KiB buffers + overhead (give headroom) - same as Lab C4.
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=524288

CONFIG_MAIN_STACK_SIZE=4096

# USB CDC ACM transport, reused from the SDK's mipi_capture_to_enc sample
# (its Kconfig wraps these under CONFIG_USB_TRANSPORT_CDC_ACM; this lab
# only ever needs CDC, so the symbols are set directly here instead of
# adding an unused mode-select option).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CRC=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
