# Camera (video_syna0 / MIPI CSI) - same as lab_c1_basic_capture / lab_c2_continuous_stats
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_VIDEO=y
CONFIG_VIDEO_INIT_PRIORITY=90
CONFIG_VIDEO_SYNA_MIPI=y
CONFIG_VIDEO_SYNA_MIPI_INIT_PRIORITY=110
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=400000
CONFIG_VIDEO_BUFFER_POOL_ALIGN=64
CONFIG_I2C_SHELL=n

CONFIG_FPU=y

CONFIG_HEAP_MEM_POOL_SIZE=200000

CONFIG_CMSIS_RTOS_V2=y
CONFIG_POLL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_NUM_PREEMPT_PRIORITIES=56

CONFIG_PRINTK=y
CONFIG_LOG_MODE_IMMEDIATE=y

# TFT (ST7789V3 raw-SPI driver, ai_labs/03_sensor_anomaly) - SPI0 + GPIO
# for reset/dc pins. Console is moved to UART0 alt pins by the board
# overlay because SPI0 shares pads with UART1 (see the lab doc).
CONFIG_SPI=y
CONFIG_GPIO=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_UART_CONSOLE=y

# Interactive shell so the preview interval can be tuned live at
# runtime ("preview interval set <ms>") instead of rebuilding/
# reflashing for every test - see main.c and the lab doc.
#
# CONFIG_SHELL=y alone overflows the 128KB ITCM flash (this board's
# zephyr,flash) by ~9KB - the default shell pulls in history, stats,
# wildcards, metakeys and a log backend integration that this lab does
# not need. CONFIG_SHELL_MINIMAL=y strips all of that down to just the
# line editor + command dispatch, which is enough for the two "preview
# interval get/set" commands here and fits comfortably.
CONFIG_SHELL=y
CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_LOG_BACKEND=n
